
<!DOCTYPE html>
<html>

<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- ADD STUDENT -->
        <div class="section">

            <h2>Add Student</h2>

            <input type="number" id="studentId" placeholder="Student ID">

            <input type="text" id="name" placeholder="Student Name">

            <input type="text" id="course" placeholder="Course">

            <button onclick="addStudent()">Add Student</button>

        </div>


        <!-- UPDATE STUDENT -->
        <div class="section">

            <h2>Update Student</h2>

            <input type="number" id="updateId" placeholder="Student ID">

            <input type="text" id="updateName" placeholder="New Name">

            <input type="text" id="updateCourse" placeholder="New Course">

            <button onclick="updateStudent()">Update Student</button>

        </div>


        <!-- DELETE STUDENT -->
        <div class="section">

            <h2>Delete Student</h2>

            <input type="number" id="deleteId" placeholder="Student ID">

            <button onclick="deleteStudent()">Delete Student</button>

        </div>


        <!-- VIEW STUDENT -->
        <div class="section">

            <h2>View Student</h2>

            <input type="number" id="viewId" placeholder="Student ID">

            <button onclick="viewStudent()">View Student</button>

            <button onclick="viewAllStudents()">View All Students</button>

        </div>


        <!-- DISPLAY RECORDS -->
        <div class="section">

            <h2>Student Records</h2>

            <div id="result"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
